name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  BUILD_CONFIGURATION: Release
  TEST_PROJECT: src/QualiFrame.Tests/QualiFrame.Tests.csproj
  TEST_RESULTS_TRX: test-results.trx

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate FRAMEWORK_MANIFEST.json
        run: bash scripts/ci-validate-manifest.sh

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Pinned SHAs: reliable on GitHub.com and when @v4 tag resolution is blocked locally.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build and test
        run: bash scripts/ci-build-test.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            test-results.trx
            test-results-*.trx
            **/test-results.trx
            **/TestResults/**
