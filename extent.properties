# ExtentReports configuration (optional override for appsettings.json)
# Paths align with Reporting section in appsettings.json (Results/ folder).

extent.reporter.avent.start=false
extent.reporter.bdd.start=false
extent.reporter.cards.start=false
extent.reporter.email.start=false
extent.reporter.html.start=true
extent.reporter.klov.start=false
extent.reporter.logger.start=false
extent.reporter.spark.start=true
extent.reporter.tabular.start=false

extent.reporter.spark.out=Results/Reports/SparkReport
extent.reporter.spark.documentTitle=QualiFrame Test Report
extent.reporter.spark.reportName=QualiFrame Automation Test Results
extent.reporter.spark.theme=Standard

screenshot.dir=Results/Screenshots
screenshot.rel.path=../Screenshots/
